    - g4f/gpt-4o-mini

  free:
    - g4f/gpt-4o-mini
    - pollinations/gpt-4o
    - opencode_zen/llama-3.1-8b
    - llm7/llama-3.1-8b
    - aionlabs/mistral-7b
    - g4f/meta-llama/Meta-Llama-3.1-8B-Instruct
    - ollama/llama3.2:3b

  keyless:
    - pollinations/gpt-4o
    - opencode_zen/llama-3.1-8b
    - llm7/llama-3.1-8b
    - kilo/llama-3.1-8b
    - aionlabs/mistral-7b
    - hf_router/meta-llama/Llama-3.1-8B-Instruct
    - puter/gpt-4.1-mini
    - aihorde/StableDiffusion-v15
    - g4f/gpt-4o-mini

  credits:
    - together/meta-llama/Llama-3.3-70B-Instruct
    - fireworks/meta-llama/Llama-3.3-70B-Instruct
    - deepseek/deepseek-chat
    - xai/grok-2-latest
    - replicate/meta/llama-3.1-8b-instruct
    - deepinfra/meta-llama/Llama-3.3-70B-Instruct
    - nebius/Llama-3.3-70B-Instruct
    - ovh/meta-llama/Llama-3.1-8B-Instruct
    - siliconflow/deepseek-ai/DeepSeek-V3
    - g4f/gpt-4o-mini
    - ollama/llama3.2:3b

  # ── provider pass-through aliases ────────────────────────────────────────
  # Each route contains just that provider's default best model, so
