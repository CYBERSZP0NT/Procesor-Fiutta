    - google/gemini-flash-lite-latest
    - cerebras/llama3.1-8b
    - opencode_zen/llama-3.1-8b
    - openrouter/meta-llama/llama-3.1-8b-instruct:free
    - g4f/gpt-4o-mini
    - pollinations/gpt-4o-mini
