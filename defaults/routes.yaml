# ============================================================================
# szmelc-router — default routes (embedded data)
#
# Route format:  provider/model
#   – the segment before the FIRST "/" is the provider name
#   – everything after is the model ID sent to that provider's API
#   – model IDs may themselves contain "/" (e.g. openrouter vendor/model)
#
# Order within a list = fallback priority (left → right).
# Adding a new route = adding one list here (or user config overrides).
# ============================================================================

routes:
  # ── primary aliases ──────────────────────────────────────────────────────
  auto:
    - google/gemini-2.5-flash
    - groq/llama-3.3-70b-versatile
    - deepseek/deepseek-chat
    - openrouter/deepseek/deepseek-r1:free
    - together/meta-llama/Llama-3.3-70B-Instruct
    - g4f/gpt-4o-mini
    - pollinations/gpt-4o
    - ollama/llama3.2:3b

  smart:
