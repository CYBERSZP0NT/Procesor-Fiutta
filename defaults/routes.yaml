  code:
    - groq/llama-3.3-70b-versatile
    - openrouter/qwen/qwen-2.5-coder-32b-instruct:free
    - together/qwen/qwen-2.5-coder-32b-instruct
    - fireworks/qwen2-5-coder-32b-instruct
    - deepinfra/qwen2.5-coder-32b-instruct
    - g4f/gpt-4o
