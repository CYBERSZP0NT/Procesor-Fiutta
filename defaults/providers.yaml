# ============================================================================
# szmelc-router — default providers (embedded data, no code changes needed)
#
# Every provider is a pure data entry here.  Adding a new source =
# adding one entry below (or one `providers:` line in user config).
# No provider name appears as a Go constant in internal/core.
#
# Fields:
#   name      – unique provider id (used in route strings, config, CLI)
#   impl      – implementation plugin to dispatch to (openailike | ollama
#               | g4fbridge | plugin)
#   base_url  – OpenAI-compatible base URL (trailing /v1 expected)
#   key_env   – ENV var(s) holding the API key(s); comma-sep = multi-key
#               rotation.  Empty = keyless.
#   kind      – keyless | keyed | local | scraper | sidecar
#   weight    – tie-break priority in chain ordering (higher = tried first)
#   header    – optional non-standard auth header name (e.g. x-goog-api-key)
#   notes     – free-tier / condition summary (shown in CLI + catalog)
# ============================================================================

providers:
  # ── keyless / zero-auth ──────────────────────────────────────────────────
  - name: pollinations
    impl: openailike
    base_url: "https://text.pollinations.ai/openai"
    kind: keyless
    weight: 30
    notes: "No auth, no signup. Free LLM API. Best-effort rate limits per IP."

